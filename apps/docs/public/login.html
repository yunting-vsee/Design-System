<!doctype html>
<!--
  Login — @vsee/ui prototype
  ──────────────────────────
  VSee Phoenix login refactored to consume @vsee/ui classes directly:
  boxed .input, solid .btn-primary, all tokens from the design system.

  Self-contained: tokens + the subset of styles.css we need are inlined so
  you can open this file directly in a browser with no build step. A brand
  (green/blue/purple) + light/dark toolbar at the top drives the login via
  the same [data-theme]/[data-mode] attributes the real design system uses.
-->
<html lang="en" data-mode="light" data-theme="green">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — @vsee/ui prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       @vsee/ui — Design Tokens (inlined from src/tokens.css)
       ═══════════════════════════════════════════════════════════════════════ */
    :root {
      --vsee-font-sans: "Figtree", system-ui, -apple-system, sans-serif;
      --vsee-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;

      --vsee-brand: #0D875C;
      --vsee-brand-semidark: #096843;
      --vsee-brand-dark: #0A6B49;
      --vsee-brand-darker: #074D35;
      --vsee-brand-light: #E6F5EE;
      --vsee-brand-50: #F0FAF5;

      --vsee-success: #367D17; --vsee-success-light: #F9FEF6;
      --vsee-info: #196CD2; --vsee-info-light: #E0F2FE;
      --vsee-warning: #FFCB5A; --vsee-warning-light: #FEF3C7;
      --vsee-danger: #D31212; --vsee-danger-light: #FEE7E7;
      --vsee-danger-dark: #991B1B;

      --vsee-black: #111827;
      --vsee-grey-900: #4B5563; --vsee-grey-800: #6B7280; --vsee-grey-700: #9CA3AF;
      --vsee-grey-600: #B0B7C3; --vsee-grey-500: #C9CED6; --vsee-grey-400: #E8EAED;
      --vsee-grey-300: #F1F2F4; --vsee-grey-200: #F8F9FA; --vsee-grey-100: #FCFCFD;
      --vsee-white: #FFFFFF;

      --vsee-text-primary: #111827; --vsee-text-secondary: #6B7280;
      --vsee-border: #E5E7EB; --vsee-border-strong: #D1D5DB;

      --vsee-text-overline-size: 12px; --vsee-text-caption-size: 13px; --vsee-text-body-size: 14px;
      --vsee-text-body-lg-size: 16px; --vsee-text-h5-size: 16px; --vsee-text-h4-size: 20px;
      --vsee-text-h3-size: 24px; --vsee-text-h2-size: 36px; --vsee-text-h1-size: 48px;

      --vsee-sp-1: 4px; --vsee-sp-2: 8px; --vsee-sp-3: 12px; --vsee-sp-4: 16px;
      --vsee-sp-5: 20px; --vsee-sp-6: 24px; --vsee-sp-8: 32px; --vsee-sp-10: 40px;
      --vsee-sp-12: 48px;

      --vsee-r-xs: 4px; --vsee-r-sm: 6px; --vsee-r-md: 8px; --vsee-r-lg: 12px;
      --vsee-r-xl: 16px; --vsee-r-2xl: 24px; --vsee-r-full: 9999px;

      --vsee-shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --vsee-shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --vsee-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --vsee-shadow-focus: 0 0 0 3px rgba(13,135,92,0.15);
      --vsee-hover-overlay: linear-gradient(rgba(0,0,0,0.07), rgba(0,0,0,0.07));

      --vsee-ease: cubic-bezier(0.4, 0, 0.2, 1);
      --vsee-t-fast: 150ms var(--vsee-ease); --vsee-t-base: 200ms var(--vsee-ease);
    }

    [data-theme="blue"] {
      --vsee-brand: #0891B2; --vsee-brand-semidark: #155E75;
      --vsee-brand-dark: #0E7490; --vsee-brand-darker: #164E63;
      --vsee-brand-light: #E0F7FA; --vsee-brand-50: #ECFEFF;
      --vsee-shadow-focus: 0 0 0 3px rgba(8,145,178,0.15);
    }
    [data-theme="purple"] {
      --vsee-brand: #7C3AED; --vsee-brand-semidark: #5E28BF;
      --vsee-brand-dark: #6332C4; --vsee-brand-darker: #47248C;
      --vsee-brand-light: #EDE9FE; --vsee-brand-50: #F5F3FF;
      --vsee-shadow-focus: 0 0 0 3px rgba(124,58,237,0.15);
    }

    [data-mode="dark"] {
      --vsee-brand-light: #0F2D22; --vsee-brand-50: #0A1F18; --vsee-brand-dark: #34D399;
      /* Brightened in dark mode so error text (form errors, input error
         border) passes WCAG AA 4.5:1 against the dark body (~6.5:1). */
      --vsee-danger: #F87171;
      --vsee-danger-light: #2D1212;
      --vsee-black: #F9FAFB;
      --vsee-grey-900: #F3F4F6; --vsee-grey-800: #E5E7EB; --vsee-grey-700: #D1D5DB;
      --vsee-grey-600: #9CA3AF; --vsee-grey-500: #6B7280; --vsee-grey-400: #4B5563;
      --vsee-grey-300: #1F2937; --vsee-grey-200: #111827; --vsee-grey-100: #0F172A;
      --vsee-white: #0B1120;
      --vsee-text-primary: #F9FAFB; --vsee-text-secondary: #9CA3AF;
      --vsee-border: #1F2937; --vsee-border-strong: #374151;
      --vsee-shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.3);
      --vsee-shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.3);
      color-scheme: dark;
    }
    [data-mode="dark"][data-theme="blue"]  { --vsee-brand-light: #0C1F2E; --vsee-brand-dark: #67E8F9; }
    [data-mode="dark"][data-theme="purple"]{ --vsee-brand-light: #1A0F2E; --vsee-brand-dark: #C4B5FD; }

    /* ═══════════════════════════════════════════════════════════════════════
       Page chrome — toolbar + centered login stage
       ═══════════════════════════════════════════════════════════════════════ */
    * { box-sizing: border-box; }
    /* Browsers don't inherit font-family on form controls by default — force it
       so every button/input/select picks up Figtree from the body. Without
       this, .btn-link renders in the UA's native button font. */
    button, input, select, textarea { font-family: inherit; font-size: inherit; }
    body {
      margin: 0;
      font-family: var(--vsee-font-sans);
      background: var(--vsee-grey-200);
      color: var(--vsee-text-primary);
      /* Pin the body to the viewport height so the page itself never
         scrolls. The stage gets the remaining space via flex; if the
         card still overflows on very short viewports, the stage
         scrolls internally — not the whole page. */
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--vsee-sp-3) var(--vsee-sp-6);
      background: var(--vsee-white);
      border-bottom: 1px solid var(--vsee-border);
      font-size: var(--vsee-text-caption-size);
    }
    .toolbar strong { font-size: var(--vsee-text-body-lg-size); font-weight: 700; }
    .toolbar-left { display: flex; align-items: center; gap: var(--vsee-sp-4); }
    .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: var(--vsee-text-body-size); font-weight: 600; color: var(--vsee-brand); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .toolbar .controls { display: flex; align-items: center; gap: var(--vsee-sp-4); }
    /* Switch Button (.btn-group) — copied from @vsee/ui (src/styles.css, Buttons → Switch Button); used by the Mode / View switches.
       :hover / :active stand in for React Aria's [data-hovered] / [data-pressed]. */
    .btn-group { display: inline-flex; position: relative; background: var(--vsee-grey-200); border-radius: var(--vsee-r-full); padding: 2px; border: 1px solid var(--vsee-grey-300); }
    .btn-group::before { content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px; width: var(--slider-w, 0); transform: translateX(var(--slider-x, 0)); background: var(--vsee-brand); border-radius: var(--vsee-r-full); box-shadow: var(--vsee-shadow-sm); transition: transform var(--vsee-t-base), width var(--vsee-t-base); pointer-events: none; }
    .btn-group .btn { position: relative; z-index: 1; height: 32px; border: none; border-radius: var(--vsee-r-full); background: transparent; color: var(--vsee-text-secondary); font-weight: 500; padding: var(--vsee-sp-2) var(--vsee-sp-6); transition: color var(--vsee-t-fast); }
    .btn-group .btn:hover { color: var(--vsee-text-primary); box-shadow: none; }
    .btn-group .btn:active { color: var(--vsee-text-primary); }
    .btn-group .btn.active-group { color: white; }
    .btn-group .btn.active-group:hover { color: white; }

    .stage {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      padding: var(--vsee-sp-2);
      overflow: auto;
    }

    /* VSee wordmark — same PNG assets the Phoenix login uses
       (`vsee-logo-brand.png` for light, `vsee-logo.png` for dark).
       Swapped via [data-mode] so the mark always reads against its surface. */
    .logo { height: 48px; display: block; }
    /* Light-mode logo follows the brand theme: the PNG's shape is used as a mask
       and filled with --vsee-brand, so green / blue / purple recolour it. */
    .logo-light {
      width: calc(48px * 315 / 106);   /* the PNG is 315 × 106 */
      background: var(--vsee-brand);
      -webkit-mask: url(vsee-logo-brand.png) center / contain no-repeat;
      mask: url(vsee-logo-brand.png) center / contain no-repeat;
    }
    .logo-dark { display: none; }
    [data-mode="dark"] .logo-light { display: none; }
    [data-mode="dark"] .logo-dark  { display: block; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       @vsee/ui component classes (copied verbatim from src/styles.css)
       .field / .form-label / .form-error-text / .input
       .btn / .btn-primary / .btn-ghost / .btn-block / .btn-link
       ═══════════════════════════════════════════════════════════════════════ */
    /* Card = frame for two columns on desktop: email login (left) + QR code login (right) */
    .login-card {
      padding: var(--vsee-sp-10);
      background: var(--vsee-white);
      border: 1px solid var(--vsee-border);
      border-radius: var(--vsee-r-xl);
      box-shadow: var(--vsee-shadow-md);
      display: flex; align-items: center; gap: var(--vsee-sp-10);
    }
    .login-main { width: 320px; display: flex; flex-direction: column; align-items: center; }
    .login-card .logo { margin-bottom: var(--vsee-sp-8); }

    /* QR code login — right column on desktop; hidden below 800px (scanning needs a second device) */
    .login-qr {
      width: 240px; align-self: stretch;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding-left: var(--vsee-sp-10); border-left: 1px solid var(--vsee-border);
    }
    .login-qr-title { font-size: var(--vsee-text-body-lg-size); font-weight: 600; color: var(--vsee-text-primary); margin: 0 0 var(--vsee-sp-4); }
    .login-qr-code { width: 176px; height: 176px; display: block; padding: var(--vsee-sp-2); background: #fff; border: 1px solid var(--vsee-border); border-radius: var(--vsee-r-md); }   /* QR stays black on white in dark mode too */
    .login-qr-hint { font-size: var(--vsee-text-caption-size); color: var(--vsee-text-secondary); margin: var(--vsee-sp-4) 0 0; line-height: 1.5; text-wrap: balance; }
    .sso-row .login-qr-btn { display: none; }   /* desktop shows the QR column instead */
    .login-qr-title:focus { outline: none; }   /* focus is moved here when the QR screen opens; it is a heading, not a control */
    .login-qr .login-qr-back { display: none; }   /* two classes so .btn-block (later in the sheet) can't override it */
    @media (max-width: 800px) {
      .login-qr { display: none; }
      .sso-row .login-qr-btn { display: flex; }
      /* "Log in with QR code" pressed: the QR screen replaces the email form */
      .login-card[data-view="qr"] .login-main { display: none; }
      .login-card[data-view="qr"] .login-qr { display: flex; width: 100%; padding-left: 0; border-left: 0; }
      .login-card[data-view="qr"] .login-qr-back { display: flex; margin-top: var(--vsee-sp-8); }
    }

    .field { display: flex; flex-direction: column; position: relative; width: 100%; }
    .form-group { margin-bottom: var(--vsee-sp-5); width: 100%; }
    .form-label { display: block; font-size: var(--vsee-text-caption-size); font-weight: 600; color: var(--vsee-text-primary); margin-bottom: var(--vsee-sp-2); }
    .form-error-text { font-size: var(--vsee-text-overline-size); color: var(--vsee-danger); margin-top: var(--vsee-sp-1); }

    .input {
      width: 100%; height: var(--vsee-sp-10);
      padding: 0 var(--vsee-sp-2) 0 var(--vsee-sp-3);
      font-family: var(--vsee-font-sans); font-size: var(--vsee-text-body-size);
      color: var(--vsee-text-primary); background: var(--vsee-white);
      border: 1px solid var(--vsee-border-strong); border-radius: var(--vsee-r-md);
      transition: all var(--vsee-t-fast); outline: none;
    }
    .input:hover { border-color: var(--vsee-grey-500); }
    .input:focus { border-color: var(--vsee-brand); box-shadow: var(--vsee-shadow-focus); }
    .input::placeholder { color: var(--vsee-text-secondary); }
    .input.error { border-color: var(--vsee-danger); }

    /* Icon-inside-input pattern — same classes as src/styles.css. The
       design system's .input-lg variant has been removed; use default
       .input (40px) everywhere instead. */
    .input-icon-wrap { position: relative; display: flex; align-items: center; width: 100%; }
    .input-with-icon-right { padding-right: 42px !important; }
    .input-icon-btn {
      position: absolute; right: 1px; top: 1px; bottom: 1px;
      width: var(--vsee-sp-10);
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none;
      border-radius: 0 var(--vsee-r-md) var(--vsee-r-md) 0;
      color: var(--vsee-text-secondary); cursor: pointer; outline: none;
      transition: all var(--vsee-t-fast);
    }
    .input-icon-btn:hover { background-image: var(--vsee-hover-overlay); color: var(--vsee-text-primary); }
    /* The eye-toggle has two SVGs; only the one without [hidden] renders.
       Explicit rule because the HTML `hidden` attribute doesn't reliably
       hide SVG children of a flex container in every browser. */
    .input-icon-btn svg[hidden] { display: none; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: var(--vsee-sp-2); font-family: var(--vsee-font-sans); font-weight: 600;
      font-size: var(--vsee-text-body-size); height: 38px;
      padding: var(--vsee-sp-3) var(--vsee-sp-5);
      border-radius: var(--vsee-r-md); border: 1px solid transparent;
      cursor: pointer; transition: all var(--vsee-t-fast);
      white-space: nowrap; outline: none;
    }
    .btn:focus-visible { box-shadow: var(--vsee-shadow-focus); outline: 2px solid var(--vsee-brand); outline-offset: 2px; }
    .btn:disabled { background: var(--vsee-grey-300); color: var(--vsee-text-secondary); border-color: var(--vsee-border-strong); cursor: not-allowed; }
    .btn-primary { background: var(--vsee-brand); color: white; }
    .btn-primary:hover { background-image: var(--vsee-hover-overlay); box-shadow: var(--vsee-shadow-sm); }
    .btn-ghost { background: transparent; color: var(--vsee-text-primary); border: 2px solid var(--vsee-border); }
    .btn-ghost:hover { background-image: var(--vsee-hover-overlay); border-color: var(--vsee-border-strong); }
    .btn-block { display: flex; width: 100%; }
    .btn-link { background: transparent; color: var(--vsee-brand); padding: 0; border: none; font-weight: 600; font-size: var(--vsee-text-caption-size); cursor: pointer; }
    .btn-link:hover { text-decoration: underline; }

    .divider-row {
      display: flex; align-items: center; width: 100%;
      gap: var(--vsee-sp-4); margin: var(--vsee-sp-6) 0;
    }
    .divider-row .rule { flex: 1; height: 1px; background: var(--vsee-border-strong); }
    .divider-row span { font-size: var(--vsee-text-caption-size); color: var(--vsee-text-secondary); }

    .sso-row { display: flex; flex-direction: column; gap: var(--vsee-sp-3); width: 100%; }
    /* Label row: form-label on the left, small "Change email" link on the
       right. Sits above the email input; link only shown once the email
       is locked (signin step 2). */
    .label-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: var(--vsee-sp-2); }
    .label-row .form-label { margin-bottom: 0; }
    .toggle-row { margin-top: var(--vsee-sp-6); font-size: var(--vsee-text-caption-size); color: var(--vsee-text-secondary); text-align: center; }
    .version { margin-top: var(--vsee-sp-8); font-size: var(--vsee-text-overline-size); color: var(--vsee-text-secondary); font-family: var(--vsee-mono); text-align: center; }

    @media (max-width: 480px) {
      /* Phones: no card frame — the login block fills the screen with its white background */
      .stage { padding: 0; align-items: stretch; background: var(--vsee-white); }
      .login-card {
        width: 100%; padding: var(--vsee-sp-6);
        border: 0; border-radius: 0; box-shadow: none;
        flex-direction: column; align-items: stretch;
        justify-content: safe center;   /* content stays centred; "safe" keeps the top reachable if it is taller than the screen */
      }
      .login-main { width: 100%; }
    }
    /* Select (copied from preference.html) — used by the toolbar's Page / Brand dropdowns.
       Last in the sheet so .input-sm wins over this page's own .input rule. */
    .input-sm { height: 34px; padding: 0 var(--vsee-sp-2) 0 var(--vsee-sp-3); border-radius: var(--vsee-r-xs); }

    /* Select (design-system component — button trigger + popover listbox) */
    .select-trigger { display: flex; align-items: center; cursor: pointer; text-align: left; width: 100%; background: var(--vsee-white); gap: var(--vsee-sp-2); }
    .select-trigger[aria-expanded="true"] { border-color: var(--vsee-brand); box-shadow: var(--vsee-shadow-focus); }
    .select-chevron { margin-left: auto; color: var(--vsee-grey-600); flex-shrink: 0; transition: transform var(--vsee-t-fast); }
    .select-trigger[aria-expanded="true"] .select-chevron { transform: rotate(180deg); }
    .select-popover {
      position: absolute; left: 0; top: calc(100% + 4px);
      background: var(--vsee-white);
      border: 1px solid var(--vsee-border);
      border-radius: var(--vsee-r-lg);
      box-shadow: var(--vsee-shadow-lg);
      padding: var(--vsee-sp-1);
      min-width: 100%;
      width: max-content; max-width: min(320px, 90vw);
      box-sizing: border-box; outline: none; z-index: 50;
    }
    .select-popover[hidden] { display: none; }
    .select-popover:not([hidden]) { animation: pop-in 150ms ease-out; }
    @keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .select-listbox { outline: none; padding: 0; max-height: 33vh; overflow-y: auto; }
    .select-option {
      font-size: var(--vsee-text-body-size);
      padding: var(--vsee-sp-2) var(--vsee-sp-3);
      border-radius: var(--vsee-r-md);
      cursor: pointer; outline: none;
      transition: background var(--vsee-t-fast);
      white-space: nowrap;
    }
    .select-option[data-focused] { background: var(--vsee-brand-light); }
    .select-option[data-selected] { background: var(--vsee-brand); color: white; }
    .select-option[data-selected][data-focused] { background: var(--vsee-brand); color: white; }

    /* Brand color circles — copied from @vsee/ui docs (src/styles.css, sidebar "Brand Color" dots) */
    .ds-theme-options { display: flex; gap: var(--vsee-sp-2); }
    .ds-theme-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--vsee-border); cursor: pointer; transition: all var(--vsee-t-fast); padding: 0; }
    .ds-theme-dot:hover { transform: scale(1.15); }
    .ds-theme-dot.active { border-color: var(--vsee-grey-800); box-shadow: 0 0 0 2px var(--vsee-white), 0 0 0 4px var(--vsee-grey-800); }
    .ds-theme-green { background: #0D875C; }
    .ds-theme-blue { background: #0891B2; }
    .ds-theme-purple { background: #7C3AED; }
    /* Checkbox — same look as preference.html's .check-item / .check-box; here with a real (visually hidden) input */
    .check-item { display: flex; align-items: center; gap: 10px; font-size: var(--vsee-text-body-size); color: var(--vsee-text-primary); cursor: pointer; padding: 6px 0; }
    .check-box { width: 18px; height: 18px; border: 1.5px solid var(--vsee-border-strong); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all var(--vsee-t-fast); }
    .check-box.checked { background: var(--vsee-brand); border-color: var(--vsee-brand); color: white; }
    .check-box .check-svg { display: none; }
    .check-box.checked .check-svg { display: block; }
    .check-item input:focus-visible + .check-box { box-shadow: var(--vsee-shadow-focus); }

    /* Top bar "QR code login" unchecked → no QR column, no QR button, email form always shown */
    :root[data-qr="off"] .login-card .login-qr,
    :root[data-qr="off"] .sso-row .login-qr-btn { display: none; }
    :root[data-qr="off"] .login-card .login-main { display: flex; }
  </style>
</head>

<body>
  <header class="toolbar">

  <script>
    /* Toolbar wiring: brand-theme + light/dark mode */
    const root = document.documentElement;
    /* Select — mirrors the React-Aria Select component: a button trigger,
       a popover listbox, roving focus via data-focused. Fires a `change`
       CustomEvent with { value, label } so consumer code reads exactly
       like the native version (.value + change listener). */
    function wireSelect(root) {
      const trigger = root.querySelector('.select-trigger');
      const popover = root.querySelector('.select-popover');
      const valueEl = root.querySelector('[data-select-value]');
      const options = Array.from(root.querySelectorAll('.select-option'));
      let focusIdx = options.findIndex(o => o.hasAttribute('data-selected'));
      if (focusIdx < 0) focusIdx = 0;

      const setValue = (opt) => {
        options.forEach(o => o.removeAttribute('data-selected'));
        opt.setAttribute('data-selected', '');
        valueEl.textContent = opt.textContent;
        root.dataset.value = opt.dataset.value;
        root.dispatchEvent(new CustomEvent('change', { detail: { value: opt.dataset.value, label: opt.textContent } }));
      };
      // Seed data-value from the pre-selected option so getters work
      // before any user interaction.
      const seeded = options.find(o => o.hasAttribute('data-selected'));
      if (seeded) root.dataset.value = seeded.dataset.value;

      const setFocused = (i) => {
        options.forEach(o => o.removeAttribute('data-focused'));
        options[i].setAttribute('data-focused', '');
        options[i].scrollIntoView({ block: 'nearest' });
        focusIdx = i;
      };

      const open = () => {
        if (trigger.disabled) return;
        // Close any other open selects first — only one listbox open at a time.
        document.querySelectorAll('[data-select] .select-popover:not([hidden])').forEach(p => {
          if (p !== popover) {
            p.hidden = true;
            p.parentElement.querySelector('.select-trigger').setAttribute('aria-expanded', 'false');
          }
        });
        popover.hidden = false;
        trigger.setAttribute('aria-expanded', 'true');
        setFocused(Math.max(0, options.findIndex(o => o.hasAttribute('data-selected'))));
      };
      const close = () => {
        popover.hidden = true;
        trigger.setAttribute('aria-expanded', 'false');
        options.forEach(o => o.removeAttribute('data-focused'));
      };

      trigger.addEventListener('click', () => {
        popover.hidden ? open() : close();
      });
      // Focus stays on the trigger while the popover is open; all keys
      // (open, navigate, commit, close) are handled here in one place.
      trigger.addEventListener('keydown', (e) => {
        if (popover.hidden) {
          if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
            e.preventDefault(); open();
          }
          return;
        }
        if (e.key === 'Escape')    { e.preventDefault(); close(); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); setFocused((focusIdx + 1) % options.length); return; }
        if (e.key === 'ArrowUp')   { e.preventDefault(); setFocused((focusIdx - 1 + options.length) % options.length); return; }
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setValue(options[focusIdx]); close(); }
      });
      options.forEach((opt, i) => {
        opt.addEventListener('mouseenter', () => setFocused(i));
        opt.addEventListener('click', () => { setValue(opt); close(); trigger.focus(); });
      });

      // Expose a setDisabled method so dependent rows (master-sound → sound
      // picker) can gate the trigger.
      root.setSelectDisabled = (d) => { trigger.disabled = d; if (d) close(); };
    }
    document.querySelectorAll('[data-select]').forEach(wireSelect);
    // Close any open popover on outside click.
    document.addEventListener('click', (e) => {
      document.querySelectorAll('[data-select]').forEach(root => {
        if (!root.contains(e.target)) {
          const pop = root.querySelector('.select-popover');
          if (!pop.hidden) {
            pop.hidden = true;
            root.querySelector('.select-trigger').setAttribute('aria-expanded', 'false');
          }
        }
      });
    });

    /* Brand = color circles; the chosen one is marked .active + aria-pressed */
    const themeDots = document.getElementById('themeDots');
    themeDots.addEventListener('click', (e) => {
      const b = e.target.closest('.ds-theme-dot');
      if (!b) return;
      root.setAttribute('data-theme', b.dataset.value);
      themeDots.querySelectorAll('.ds-theme-dot').forEach(d => {
        d.classList.toggle('active', d === b);
        d.setAttribute('aria-pressed', String(d === b));
      });
    });
    /* Mode = Switch Button (Light / Dark); setBtnGroup comes from page-toolbar.js */
    const modeGroup = document.getElementById('modeGroup');
    modeGroup.addEventListener('click', (e) => {
      const b = e.target.closest('.btn');
      if (!b) return;
      root.setAttribute('data-mode', b.dataset.value);
      setBtnGroup(modeGroup, b.dataset.value);
    });

    /* Top bar "QR code login" checkbox: shows / hides the QR code login (desktop column,
       mobile button and screen). Sets data-qr on <html>, so page-toolbar.js passes it to the Mobile view frame too. */
    const qrToggle = document.getElementById('qrToggle');
    qrToggle.addEventListener('change', () => {
      qrToggle.nextElementSibling.classList.toggle('checked', qrToggle.checked);
      if (qrToggle.checked) root.removeAttribute('data-qr'); else root.setAttribute('data-qr', 'off');
    });

    /* QR code login on narrow screens: "Log in with QR code" swaps the email form for the
       QR screen; "Log in with email" swaps back. Focus follows so keyboard / screen-reader
       users land on the new screen. (Desktop always shows both; the CSS ignores data-view there.) */
    const loginCard = document.querySelector('.login-card');
    const qrBtn = document.querySelector('.login-qr-btn');
    document.querySelector('.login-qr-btn').addEventListener('click', () => {
      loginCard.dataset.view = 'qr';
      document.getElementById('qrTitle').focus();
    });
    document.getElementById('qrBack').addEventListener('click', () => {
      delete loginCard.dataset.view;
      qrBtn.focus();
    });
    /* QR code login switched off (here or from the outer page in the Mobile view): back to the email form */
    new MutationObserver(() => { if (root.getAttribute('data-qr') === 'off') delete loginCard.dataset.view; })
      .observe(root, { attributes: true, attributeFilter: ['data-qr'] });

    /* Login flow — mirrors va-main's src/components/Login.tsx:
       - sign-in: email step → password step
       - sign-up: email + password together
       - field-scoped error bubbles (email vs password)
       - pw === "fail" simulates an auth failure so the error state is visible
         without wiring a backend */
    const EMAIL_SHAPE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const emailInput   = document.getElementById('email');
    const pwInput      = document.getElementById('pw');
    const pwGroup      = document.getElementById('pwGroup');
    const continueBtn  = document.getElementById('continueBtn');
    const changeBtn    = document.getElementById('changeEmail');
    const eyeBtn       = document.getElementById('eye');
    const errEmail     = document.getElementById('errEmail');
    const errPw        = document.getElementById('errPw');
    const toggleAuthBtn= document.getElementById('toggleAuth');
    const toggleLabel  = document.getElementById('toggleLabel');

    let step = 'email';   // 'email' | 'password'
    let mode = 'signin';  // 'signin' | 'signup'
    let pwVisible = false;

    function showError(slot, input, msg) {
      slot.textContent = msg; slot.hidden = false;
      if (input) input.classList.add('error');
    }
    function clearError(slot, input) {
      slot.hidden = true; slot.textContent = '';
      if (input) input.classList.remove('error');
    }
    function clearAll() {
      clearError(errEmail, emailInput);
      clearError(errPw, pwInput);
    }

    function advanceToPassword() {
      step = 'password';
      pwGroup.hidden = false;
      emailInput.readOnly = (mode === 'signin');
      // "Change email" link is only meaningful when the email is locked;
      // in signup mode the field stays editable so no link is needed.
      changeBtn.hidden = !emailInput.readOnly;
      pwInput.focus();
    }
    function rewindToEmail() {
      step = 'email';
      pwGroup.hidden = true;
      emailInput.readOnly = false;
      changeBtn.hidden = true;
      pwInput.value = '';
      clearAll();
      emailInput.focus();
    }

    continueBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if (step === 'email' && mode === 'signin') {
        if (!email)                        return showError(errEmail, emailInput, 'Please enter your email.');
        if (!EMAIL_SHAPE.test(email))      return showError(errEmail, emailInput, "That doesn't look like a valid email.");
        clearAll(); advanceToPassword();   return;
      }

      if (mode === 'signup') {
        if (!email)                        return showError(errEmail, emailInput, 'Please enter your email.');
        if (!EMAIL_SHAPE.test(email))      return showError(errEmail, emailInput, "That doesn't look like a valid email.");
      }

      const pw = pwInput.value;
      if (!pw.trim()) return showError(errPw, pwInput, 'Please enter your password.');
      if (pw === 'fail') return showError(errPw, pwInput, 'Sign-in failed. Please check your credentials.');

      continueBtn.disabled = true;
      continueBtn.textContent = 'Connecting...';
      setTimeout(() => {
        continueBtn.disabled = false;
        continueBtn.textContent = mode === 'signup' ? 'Sign up' : 'Continue';
        alert('Would sign in: ' + email);
      }, 800);
    });

    emailInput.addEventListener('input', () => clearError(errEmail, emailInput));
    pwInput.addEventListener('input',    () => clearError(errPw, pwInput));
    emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') continueBtn.click(); });
    pwInput.addEventListener('keydown',    (e) => { if (e.key === 'Enter') continueBtn.click(); });

    changeBtn.addEventListener('click', rewindToEmail);

    eyeBtn.addEventListener('click', () => {
      pwVisible = !pwVisible;
      pwInput.type = pwVisible ? 'text' : 'password';
      eyeBtn.setAttribute('aria-label', pwVisible ? 'Hide password' : 'Show password');
      // Swap the eye icon — toggleAttribute is more reliable than the
      // `.hidden` property setter on SVGElement across browsers.
      eyeBtn.querySelector('.eye-show').toggleAttribute('hidden', pwVisible);
      eyeBtn.querySelector('.eye-hide').toggleAttribute('hidden', !pwVisible);
    });

    toggleAuthBtn.addEventListener('click', () => {
      mode = mode === 'signin' ? 'signup' : 'signin';
      if (mode === 'signup') {
        toggleLabel.textContent = 'Already have an account? ';
        toggleAuthBtn.textContent = 'Sign in';
        continueBtn.textContent = 'Sign up';
        advanceToPassword();
        emailInput.readOnly = false;
      } else {
        toggleLabel.textContent = "Don't have an account? ";
        toggleAuthBtn.textContent = 'Sign up';
        continueBtn.textContent = 'Continue';
        rewindToEmail();
      }
    });
  </script>
  <script src="page-toolbar.js"></script>
</body>
</html>
